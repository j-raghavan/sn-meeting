[package]
name = "meeting-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Meetings core (libmeeting.so): key files, provider calls via rig-core, and a feature-gated JNI bridge."

[lib]
name = "meeting"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { workspace = true }
jni = { workspace = true, optional = true }

[features]
default = []
# Only the Android build enables this (buildApk.sh); host tests never see `jni` (INV5).
jni-bridge = ["dep:jni"]
