name: Release

# F14-FR2 (ADR D11): inkread's release workflow, step for step. When a v* tag is pushed (or on a
# manual dispatch) build the signed APK and publish a GitHub Release with generated notes.
# Mirrors the local `./buildApk.sh` pipeline: cargo-ndk builds libmeeting.so, then Gradle
# assembles the APK. The APK is attached to the Release so it can be sideloaded without a
# toolchain, and the in-app updater (F14-FR4..FR8) reads it from releases/latest.
#
# SIGNING (ADR D12): when the repo secret MEETINGS_KEYSTORE_BASE64 (+ MEETINGS_KEYSTORE_PASSWORD /
# MEETINGS_KEY_ALIAS / MEETINGS_KEY_PASSWORD) is set, the APK is signed with the stable Meetings
# release key, which the in-app updater needs. Without the secret it falls back to the debug key
# (and the updater stays inert: the installed-signer check fails closed).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build & release (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write # create the Release and upload the APK asset

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: build APK & publish release
    runs-on: ubuntu-latest
    steps:
      # On a tag push, github.ref IS the tag. On manual dispatch the tag may not exist yet, so
      # check out the branch it was dispatched from (github.ref) and create the tag below; never
      # `ref: <tag>`, which would fail the checkout for a new tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # --- Resolve the release tag (push: the pushed tag; dispatch: the input) ---
      - name: Resolve release tag
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::Release tag must start with 'v' (got '$tag')"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # versionName for the APK = the tag without the leading 'v' (v0.2.0 -> 0.2.0).
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (version ${tag#v})"

      # --- Create + push the annotated tag on manual dispatch (push events already have it) ---
      - name: Create and push tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin; bump the version or delete the tag first."
            exit 1
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "Tagged $(git rev-parse --short HEAD) as $TAG and pushed to origin."

      # --- JDK (Gradle needs 17-21) ---
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # --- Rust (honours rust-toolchain.toml: channel + components + android targets) ---
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # --- Point cargo-ndk at the runner's preinstalled Android NDK (same as ci.yml) ---
      - name: Configure Android NDK
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          test -n "$ndk" || { echo "::error::No Android NDK found on the runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "Using NDK: $ndk"

      # --- Stamp the crate version from the tag (build-time, for THIS build's artifact) ---
      # meeting-core reports CARGO_PKG_VERSION over JNI (nativeVersion; Settings shows "Core v…"),
      # and env!() bakes it at compile time, so the workspace version must be set BEFORE cargo-ndk
      # runs. meeting-core inherits version.workspace, so the single root line drives it. This
      # edits the working tree only; the "Sync version to the default branch" step at the end
      # records the same bump on main so the checked-in file tracks releases.
      - name: Stamp crate version from tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Anchored at line start: dependency versions are inline tables (`x = { version = … }`)
          # and won't match, so only [workspace.package].version is rewritten.
          n="$(grep -c '^version = ' Cargo.toml)"
          test "$n" -eq 1 || { echo "::error::expected exactly 1 workspace version line, found $n"; exit 1; }
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "meeting-core crate version -> $(grep '^version = ' Cargo.toml)"

      # --- Decode the release signing keystore (ADR D12) ---
      # The updater requires a STABLE release key: Android rejects an update whose signer differs
      # from the installed app. When MEETINGS_KEYSTORE_BASE64 is set, decode it to an ephemeral file
      # under RUNNER_TEMP (never committed) and export the signing vars app/build.gradle.kts reads;
      # without it the build falls back to the debug key and the updater stays inert. Passwords go
      # via $GITHUB_ENV, which is masked and not printed; they never appear in logs or on a command
      # line (keytool reads the store password from the environment).
      #
      # The certificate's SHA-256 (public: it is in every signed APK) becomes BuildConfig's
      # RELEASE_CERT_SHA256, so the app can tell a copy signed with another key that it can't
      # update itself (F14-FR1/FR2).
      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MEETINGS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MEETINGS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEETINGS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEETINGS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::No MEETINGS_KEYSTORE_BASE64 secret: the release APK will be DEBUG-signed and cannot update an existing install. Add the four MEETINGS_* signing secrets to enable release signing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ks="$RUNNER_TEMP/meetings-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          cert="$(keytool -list -v -keystore "$ks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" \
            | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]{95}).*/\1/p' | head -1)"
          test -n "$cert" || { echo "::error::Couldn't read the release certificate's SHA-256 from the keystore"; exit 1; }
          {
            echo "MEETINGS_KEYSTORE_FILE=$ks"
            echo "MEETINGS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MEETINGS_KEY_ALIAS=$KEY_ALIAS"
            echo "MEETINGS_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ORG_GRADLE_PROJECT_meetingsReleaseCertSha256=$cert"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          echo "Release keystore staged for signing (certificate SHA-256 $cert)."

      # --- Build the APK via the canonical script (Rust core + Gradle) ---
      # Gradle reads ORG_GRADLE_PROJECT_<name> env vars as project properties, so the tag's
      # version lands in the APK's versionName/versionCode (see app/build.gradle.kts); versionCode
      # is the monotonic run number. The signing vars exported above (when present) flow in via
      # $GITHUB_ENV to the release signingConfig. --no-gates as inkread's release build: the gates
      # ran in ci.yml on the pull request that brought the tagged commit.
      - name: Build APK (./buildApk.sh --no-gates)
        env:
          ORG_GRADLE_PROJECT_meetingsVersionName: ${{ steps.ver.outputs.version }}
          ORG_GRADLE_PROJECT_meetingsVersionCode: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_meetingsUpdateRepo: ${{ vars.MEETINGS_UPDATE_REPO || github.repository }}
        run: |
          chmod +x ./buildApk.sh
          ./buildApk.sh --no-gates

      - name: Locate the built APK
        id: apk
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk" || { echo "::error::No APK produced under app/build/outputs/apk/release"; exit 1; }
          # Give the asset a versioned, tag-named filename.
          tag="${{ steps.ver.outputs.tag }}"
          dest="meetings-${tag}.apk"
          cp "$apk" "$dest"
          sha256sum "$dest" > "$dest.sha256"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          echo "sha256=$dest.sha256" >> "$GITHUB_OUTPUT"
          echo "Built: $dest"

      # --- F14-AC1: the APK carries the certificate the app was told to expect ---
      - name: Check the APK's signing certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          APK: ${{ steps.apk.outputs.path }}
          CERT: ${{ steps.signing.outputs.cert }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          got="$("$apksigner" verify --print-certs "$APK" | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]{64}).*/\1/p' | head -1)"
          want="$(echo "$CERT" | tr -d ':' | tr 'A-F' 'a-f')"
          echo "APK signer SHA-256: $got"
          [ "$got" = "$want" ] || { echo "::error::The APK is signed by $got, not the release key $want"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Meetings ${{ steps.ver.outputs.tag }}
          generate_release_notes: true # changelog from merged PRs/commits since the last tag
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.sha256 }}
          body: |
            ### Meetings ${{ steps.ver.outputs.tag }}

            Record meetings with an external mic, then transcribe and summarise them, on the
            Supernote (Android 11).

            **Install (sideload):**
            ```
            adb install -r meetings-${{ steps.ver.outputs.tag }}.apk
            ```
            Installing stops a recording in progress; finish it first.

            > ${{ steps.signing.outputs.signed == 'true' && 'Signed with the Meetings release key: installs and in-app updates verify against it. Verify the attached `.sha256` before installing.' || 'This build is DEBUG-signed for sideloading; it cannot update an existing install in place. Verify the attached `.sha256` before installing.' }}

            ---

      # --- Record the released version on the default branch (best-effort) ---
      # The build-time stamp above only touched the working tree at the tag; this lands the same
      # bump on the default branch so the checked-in Cargo.toml/Cargo.lock track the latest release
      # (the tagged commit itself is immutable). Runs only on a green release and never fails it:
      # if the push is rejected (branch protection, or the branch advanced mid-release) the release
      # still stands; the repo just misses this cosmetic bump. `cargo update --workspace` rewrites
      # only the workspace members in the lockfile. `[skip ci]` keeps the bump from re-triggering
      # CI. The subject uses commit-checks.yml's `Release` id.
      - name: Sync version to the default branch
        if: success()
        continue-on-error: true
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git reset --hard HEAD               # drop the build-time working-tree stamp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            n="$(grep -c '^version = ' Cargo.toml)"
            test "$n" -eq 1 || { echo "::warning::expected 1 workspace version line, found $n; skipping sync"; exit 0; }
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
            cargo update --workspace          # sync the workspace entry in Cargo.lock to $VERSION
            if git diff --quiet -- Cargo.toml Cargo.lock; then
              echo "$BRANCH already at $VERSION; nothing to sync."; exit 0
            fi
            git add Cargo.toml Cargo.lock
            git commit -m "Release: set workspace version to $VERSION [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "Synced version $VERSION to $BRANCH."; exit 0
            fi
            echo "::notice::push to $BRANCH rejected (attempt $attempt); refetching and retrying."
          done
          echo "::warning::could not sync the version bump to $BRANCH after retries; the release is unaffected."
