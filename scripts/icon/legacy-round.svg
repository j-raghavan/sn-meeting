<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
<circle cx="216" cy="216" r="216" fill="#F2ECDE"/>
<g transform="translate(216 216) scale(1.193) translate(-216 -216)"><g transform="translate(216 216) scale(1) translate(-218 -204)">
  <!-- Meetings mark: a desk calendar block with depth, a studio mic in front, a fountain pen leaning on it.
       Inkwell language, as inkread's mark: a few bold ink shapes and large paper areas, separations in the
       background colour, thick enough to survive the 56 dp home-screen logo and the 48 dp launcher tile. -->
  <!-- Calendar block: extruded right and bottom faces (depth 22,18), two bold page edges cut in paper -->
  <path d="M290 112 L312 130 L312 290 L290 272 Z" fill="#111111"/>
  <path d="M112 272 L290 272 L312 290 L134 290 Z" fill="#111111"/>
  <path d="M134 290 L312 290 L312 130" fill="none" stroke="#111111" stroke-width="10" stroke-linejoin="round"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="146" y1="282" x2="294" y2="282"/>
    <line x1="302" y1="144" x2="302" y2="272"/>
  </g>
  <!-- Front face: an ink header band over a large paper page -->
  <rect x="112" y="112" width="178" height="160" rx="14" fill="#111111" stroke="#F2ECDE" stroke-width="9"/>
  <rect x="121" y="154" width="160" height="109" rx="8" fill="#FFFFFF"/>
  <!-- Date grid 3 x 2: outlined days, today solid -->
  <g fill="none" stroke="#111111" stroke-width="6">
    <rect x="139" y="171" width="32" height="28" rx="6"/><rect x="185" y="171" width="32" height="28" rx="6"/>
    <rect x="231" y="171" width="32" height="28" rx="6"/>
    <rect x="139" y="215" width="32" height="28" rx="6"/><rect x="231" y="215" width="32" height="28" rx="6"/>
  </g>
  <rect x="182" y="212" width="38" height="34" rx="7" fill="#111111"/>
  <!-- Binder rings -->
  <rect x="144" y="92" width="18" height="42" rx="9" fill="#111111" stroke="#F2ECDE" stroke-width="8"/>
  <rect x="240" y="92" width="18" height="42" rx="9" fill="#111111" stroke="#F2ECDE" stroke-width="8"/>

  <!-- Studio microphone, front left (tucked over the calendar's left edge for a squarer mark):
       an outlined capsule with three bold grille bars -->
  <g transform="translate(26 0)">
  <path d="M78 212 v14 a36 36 0 0 0 72 0 v-14" fill="none" stroke="#F2ECDE" stroke-width="24" stroke-linecap="round"/>
  <path d="M78 212 v14 a36 36 0 0 0 72 0 v-14" fill="none" stroke="#111111" stroke-width="11" stroke-linecap="round"/>
  <rect x="106" y="260" width="16" height="44" fill="#111111" stroke="#F2ECDE" stroke-width="8"/>
  <rect x="78" y="298" width="72" height="18" rx="9" fill="#111111" stroke="#F2ECDE" stroke-width="8"/>
  <rect x="88" y="144" width="52" height="96" rx="26" fill="#F2ECDE" stroke="#F2ECDE" stroke-width="18"/>
  <rect x="88" y="144" width="52" height="96" rx="26" fill="#FFFFFF" stroke="#111111" stroke-width="10"/>
  <g stroke="#111111" stroke-width="7" stroke-linecap="round">
    <line x1="104" y1="172" x2="124" y2="172"/><line x1="104" y1="192" x2="124" y2="192"/>
    <line x1="104" y1="212" x2="124" y2="212"/>
  </g>
  </g>
  <!-- Fountain pen leaning across the right (drawn in closer for a squarer mark) -->
  <g transform="translate(-30 0) rotate(32 304 236)">
    <rect x="290" y="128" width="30" height="134" rx="13" fill="#111111" stroke="#F2ECDE" stroke-width="9"/>
    <rect x="290" y="164" width="30" height="9" fill="#FFFFFF"/>
    <path d="M292 262 L318 262 L305 312 Z" fill="#111111" stroke="#F2ECDE" stroke-width="8" stroke-linejoin="round"/>
    <line x1="305" y1="272" x2="305" y2="296" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</g></g>
</svg>
